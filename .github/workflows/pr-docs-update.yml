name: AI PR Docs Update

on:
  workflow_call:
    secrets:
      CODEX_AUTH_JSON_B64:
        required: false
      CURSOR_API_KEY:
        required: false
      STATE_ENCRYPTION_PASSPHRASE:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-docs-update-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      default_branch: ${{ steps.context.outputs.default_branch }}
      instruction_body: ${{ steps.context.outputs.instruction_body }}
      merge_commit_sha: ${{ steps.context.outputs.merge_commit_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      pr_url: ${{ steps.context.outputs.pr_url }}
      should_run: ${{ steps.context.outputs.should_run }}
      trigger_actor: ${{ steps.context.outputs.trigger_actor }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
    steps:
      - name: ツールリポジトリ (ai-driven-workflow) を checkout する
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aidw

      - name: docs 更新コンテキストを解決する
        id: context
        shell: bash
        run: |
          bash .aidw/scripts/docs_update/resolve_merge_context.sh

      - name: 対象外 PR をスキップする
        if: steps.context.outputs.should_run != 'true'
        shell: bash
        run: |
          case "${{ steps.context.outputs.skip_reason }}" in
            docs_update_pr)
              echo "AIドキュメント更新ラベル付き PR のためスキップします"
              ;;
            not_merged)
              echo "マージされていない PR close のためスキップします"
              ;;
            not_default_base)
              echo "既定ブランチ以外へのマージのためスキップします"
              ;;
            not_pr_closed)
              echo "PR close イベントではないためスキップします"
              ;;
            *)
              echo "条件を満たさないためスキップします"
              ;;
          esac

  run:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    uses: ./.github/workflows/pr-common.yml
    secrets: inherit
    with:
      context_sha: ${{ needs.prepare.outputs.merge_commit_sha }}
      instruction_body: ${{ needs.prepare.outputs.instruction_body }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_url: ${{ needs.prepare.outputs.pr_url }}
      run_mode: docs_update
      target_ref: ${{ needs.prepare.outputs.default_branch }}
      trigger_actor: ${{ needs.prepare.outputs.trigger_actor }}
