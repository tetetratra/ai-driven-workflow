name: AI PR State Cleanup

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: ツールリポジトリ (ai-driven-workflow) を checkout する
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aidw

      - name: 状態 Artifact を削除する
        shell: bash
        run: |
          bash .aidw/scripts/ai_pr/state/delete_state_artifact.sh
