name: AI PR Bootstrap

on:
  workflow_call:
    secrets:
      CODEX_AUTH_JSON_B64:
        required: false
      CURSOR_API_KEY:
        required: false
      STATE_ENCRYPTION_PASSPHRASE:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.create.outputs.branch_name }}
      pr_number: ${{ steps.create.outputs.pr_number }}
      pr_url: ${{ steps.create.outputs.pr_url }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 導入先リポジトリを checkout する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ツールリポジトリ (ai-driven-workflow) を checkout する
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aidw
          submodules: recursive

      - name: 実行環境変数を準備する
        shell: bash
        run: |
          echo "CODEX_HOME=${RUNNER_TEMP}/codex-home" >> "$GITHUB_ENV"
          echo "STATE_ROOT=${RUNNER_TEMP}/codex-state" >> "$GITHUB_ENV"

      - name: 実行する AI CLI を決定する
        id: cli
        shell: bash
        env:
          AI_CLI_TOOL: ${{ vars.AI_CLI_TOOL }}
        run: |
          selected="$(printf '%s' "${AI_CLI_TOOL:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$selected" in
            ""|codex)
              tool="codex"
              ;;
            cursor-cli)
              tool="cursor-cli"
              ;;
            *)
              echo "warning: unsupported AI_CLI_TOOL '$selected'. Fallback to codex."
              tool="codex"
              ;;
          esac
          echo "tool=$tool" >> "$GITHUB_OUTPUT"

      - name: 認証情報を復元する
        id: auth
        shell: bash
        env:
          AI_CLI_TOOL: ${{ steps.cli.outputs.tool }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          available="false"
          case "${AI_CLI_TOOL}" in
            codex)
              if [ -n "${CODEX_AUTH_JSON_B64:-}" ]; then
                mkdir -p "$CODEX_HOME"
                chmod 700 "$CODEX_HOME"
                printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode > "$CODEX_HOME/auth.json"
                chmod 600 "$CODEX_HOME/auth.json"
                available="true"
              fi
              ;;
            cursor-cli)
              if [ -n "${CURSOR_API_KEY:-}" ]; then
                available="true"
              fi
              ;;
            *)
              available="false"
              ;;
          esac
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx を設定する
        if: steps.auth.outputs.available == 'true'
        uses: docker/setup-buildx-action@v4

      - name: runner イメージを build する
        if: steps.auth.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./.aidw/docker
          file: ./.aidw/docker/runner.Dockerfile
          load: true
          tags: ai-runner:${{ github.run_id }}

      - name: Issue タイトルから branch slug を生成する
        id: branch_slug_ai
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          AI_CLI_TOOL: ${{ steps.cli.outputs.tool }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          mkdir -p "${STATE_ROOT}/bootstrap"
          printf '%s' "$ISSUE_TITLE" > "${STATE_ROOT}/bootstrap/issue-title.txt"
          docker run --rm \
            -e AI_CLI_TOOL="${AI_CLI_TOOL}" \
            -e CODEX_HOME=/codex-home \
            -e CODEX_MODEL="${CODEX_MODEL}" \
            -e CURSOR_API_KEY="${CURSOR_API_KEY}" \
            -e ISSUE_TITLE_FILE=/state/bootstrap/issue-title.txt \
            -e OUTPUT_FILE=/state/bootstrap/branch-slug.txt \
            -v "${GITHUB_WORKSPACE}/.aidw:/aidw" \
            -v "${CODEX_HOME}:/codex-home" \
            -v "${STATE_ROOT}:/state" \
            "ai-runner:${GITHUB_RUN_ID}" \
            bash /aidw/scripts/bootstrap/generate_branch_slug_with_ai.sh

          slug="$(cat "${STATE_ROOT}/bootstrap/branch-slug.txt" 2>/dev/null || true)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: AI 生成 slug を正規化する
        id: branch_slug
        shell: bash
        env:
          AI_SLUG: ${{ steps.branch_slug_ai.outputs.slug }}
        run: |
          slug="$AI_SLUG"
          slug="$(printf '%s' "$slug" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          slug="${slug:0:48}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: PR を作成する
        id: create
        shell: bash
        env:
          INPUT_BRANCH_SLUG: ${{ steps.branch_slug.outputs.slug }}
        run: |
          bash .aidw/scripts/bootstrap/create_pr_from_issue.sh

      - name: 依頼文言を作成した PR に転記する
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
        run: |
          comment_file="$(mktemp)"
          {
            printf '依頼文言:\n'
            printf '%s\n' "$ISSUE_TITLE"
            if [ -n "$ISSUE_BODY" ]; then
              printf '\n'
              printf '%s\n' "$ISSUE_BODY"
            fi
            printf '\n元 issue: %s\n' "$ISSUE_URL"
          } > "$comment_file"
          gh pr comment "$PR_NUMBER" --body-file "$comment_file"
          rm -f "$comment_file"

      - name: 作成した PR へのリンクを元 issue に残す
        shell: bash
        run: |
          gh issue comment "${{ steps.create.outputs.issue_number }}" \
            --body "対応用 PR を作成しました: ${{ steps.create.outputs.pr_url }}"

  run:
    needs: bootstrap
    uses: ./.github/workflows/pr-common.yml
    secrets: inherit
    with:
      instruction_body: |
        依頼文言:
        ${{ github.event.issue.title }}

        ${{ github.event.issue.body }}

        元 issue: ${{ github.event.issue.html_url }}
      pr_number: ${{ needs.bootstrap.outputs.pr_number }}
      pr_url: ${{ needs.bootstrap.outputs.pr_url }}
      target_ref: ${{ needs.bootstrap.outputs.branch_name }}
      trigger_actor: ${{ github.event.issue.user.login }}
