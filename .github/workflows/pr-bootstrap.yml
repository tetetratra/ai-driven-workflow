name: AI PR Bootstrap

on:
  workflow_call:
    secrets:
      CODEX_AUTH_JSON_B64:
        required: false
      CURSOR_API_KEY:
        required: false
      STATE_ENCRYPTION_PASSPHRASE:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  models: read
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.create.outputs.branch_name }}
      pr_number: ${{ steps.create.outputs.pr_number }}
      pr_url: ${{ steps.create.outputs.pr_url }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      INPUT_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: 導入先リポジトリを checkout する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ツールリポジトリ (ai-driven-workflow) を checkout する
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .aidw
          submodules: recursive

      - name: Issue タイトルから branch slug を生成する
        id: branch_slug_ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: ./.aidw/prompts/issue-branch-slug.prompt.yml
          input: |
            issue_title: |
              ${{ github.event.issue.title }}

      - name: AI 生成 slug を正規化する
        id: branch_slug
        shell: bash
        env:
          AI_RESPONSE: ${{ steps.branch_slug_ai.outputs.response }}
        run: |
          slug="$(printf '%s' "$AI_RESPONSE" | jq -r '.slug // empty' 2>/dev/null || true)"
          slug="$(printf '%s' "$slug" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          slug="${slug:0:48}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: PR を作成する
        id: create
        shell: bash
        env:
          INPUT_BRANCH_SLUG: ${{ steps.branch_slug.outputs.slug }}
        run: |
          bash .aidw/scripts/bootstrap/create_pr_from_issue.sh

      - name: 依頼文言を作成した PR に転記する
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
        run: |
          comment_file="$(mktemp)"
          {
            printf '依頼文言:\n'
            printf '%s\n' "$ISSUE_TITLE"
            if [ -n "$ISSUE_BODY" ]; then
              printf '\n'
              printf '%s\n' "$ISSUE_BODY"
            fi
            printf '\n元 issue: %s\n' "$ISSUE_URL"
          } > "$comment_file"
          gh pr comment "$PR_NUMBER" --body-file "$comment_file"
          rm -f "$comment_file"

      - name: 作成した PR へのリンクを元 issue に残す
        shell: bash
        run: |
          gh issue comment "${{ steps.create.outputs.issue_number }}" \
            --body "対応用 PR を作成しました: ${{ steps.create.outputs.pr_url }}"

  run:
    needs: bootstrap
    uses: ./.github/workflows/pr-common.yml
    secrets: inherit
    with:
      instruction_body: |
        依頼文言:
        ${{ github.event.issue.title }}

        ${{ github.event.issue.body }}

        元 issue: ${{ github.event.issue.html_url }}
      pr_number: ${{ needs.bootstrap.outputs.pr_number }}
      pr_url: ${{ needs.bootstrap.outputs.pr_url }}
      target_ref: ${{ needs.bootstrap.outputs.branch_name }}
      trigger_actor: ${{ github.event.issue.user.login }}
