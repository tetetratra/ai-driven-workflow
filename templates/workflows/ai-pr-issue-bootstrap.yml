# 導入先リポジトリの .github/workflows/ に配置する薄いトリガ workflow。
# __AIDW_REPO__ / __AIDW_REF__ は bin/install.sh が置換する（手動コピー時は自分で置換する）。
#   __AIDW_REPO__ 例: tetetratra/ai-driven-workflow
#   __AIDW_REF__  例: main（常に最新を追従）/ v1 / コミットSHA
name: AI PR Issue Bootstrap

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  actions: write
  contents: write
  issues: write
  models: read
  pull-requests: write

jobs:
  bootstrap:
    if: >-
      github.event.issue.state == 'open' && (
        (
          github.event.action == 'opened' &&
          contains(github.event.issue.labels.*.name, 'AI主導開発')
        ) || (
          github.event.action == 'labeled' &&
          github.event.label.name == 'AI主導開発'
        )
      )
    uses: __AIDW_REPO__/.github/workflows/ai-pr-bootstrap.yml@__AIDW_REF__
    secrets: inherit
