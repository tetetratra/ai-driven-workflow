# 導入先リポジトリの .github/workflows/ に配置する薄いトリガ workflow。
# 末尾 uses: 行の参照先(owner/repo と @ref)は bin/install.sh が設定する。
# 手動コピー時は uses: 行の owner/repo（例: tetetratra/ai-driven-workflow）と
# @ref（例: main=常に最新追従 / v1 / コミットSHA）を自分で書き換えること。
name: AI PR Issue Bootstrap

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  actions: write
  contents: write
  issues: write
  models: read
  pull-requests: write

jobs:
  bootstrap:
    if: >-
      github.event.issue.state == 'open' && (
        (
          github.event.action == 'opened' &&
          contains(github.event.issue.labels.*.name, 'AI主導開発')
        ) || (
          github.event.action == 'labeled' &&
          github.event.label.name == 'AI主導開発'
        )
      )
    uses: __AIDW_REPO__/.github/workflows/ai-pr-bootstrap.yml@__AIDW_REF__
    secrets: inherit
