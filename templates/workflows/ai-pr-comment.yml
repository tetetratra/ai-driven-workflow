# 導入先リポジトリの .github/workflows/ に配置する薄いトリガ workflow。
# __AIDW_REPO__ / __AIDW_REF__ は bin/install.sh が置換する（手動コピー時は自分で置換する）。
name: AI PR Comment

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  comment:
    uses: __AIDW_REPO__/.github/workflows/ai-pr-comment.yml@__AIDW_REF__
    secrets: inherit
