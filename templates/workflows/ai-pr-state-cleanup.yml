# 導入先リポジトリの .github/workflows/ に配置する薄いトリガ workflow。
# 末尾 uses: 行の参照先(owner/repo と @ref)は bin/install.sh が設定する。
# 手動コピー時は uses: 行を自分で書き換えること。
name: AI PR State Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: __AIDW_REPO__/.github/workflows/ai-pr-state-cleanup.yml@__AIDW_REF__
