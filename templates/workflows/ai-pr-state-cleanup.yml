# 導入先リポジトリの .github/workflows/ に配置する薄いトリガ workflow。
# __AIDW_REPO__ / __AIDW_REF__ は bin/install.sh が置換する（手動コピー時は自分で置換する）。
name: AI PR State Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: __AIDW_REPO__/.github/workflows/ai-pr-state-cleanup.yml@__AIDW_REF__
